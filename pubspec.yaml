name: salama
description: "Salama Health — climate-smart immunization for community health workers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  qr_flutter: ^4.1.0
  connectivity_plus: ^7.1.1
  # ── Backend integration ──
  flutter_riverpod: ^2.5.1      # state management
  dio: ^5.7.0                   # HTTP client
  flutter_secure_storage: ^9.2.2 # JWT token storage
  shared_preferences: ^2.3.2    # offline sync queue + cached profile
  # On-device notifications. Local, not push: a dose is confirmed by the
  # server we just called, so there is nothing to wait on a server to tell
  # us, and it keeps working offline when the dose goes to the outbox.
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/landing_screen_bg.png
